services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=ragdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  ai-cookbook-java-backend:
    build:
      context: ./ai-cookbook-java-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - SPRING_AI_OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgvector:5432/ragdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - app-network

  ai-cookbook-backend:
    build:
      context: ./ai-cookbook-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_PROFILE=${APP_PROFILE:-local}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://localhost:3000}
      - AI_CHAT_PROVIDER=${AI_CHAT_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - ANTHROPIC_TEMPERATURE=${ANTHROPIC_TEMPERATURE:-0.7}
      - DB_HOST=pgvector
      - DB_PORT=5432
      - DB_NAME=ragdb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - app-network

  ai-cookbook-frontend:
    build:
      context: ./ai-cookbook-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgvector_data:
