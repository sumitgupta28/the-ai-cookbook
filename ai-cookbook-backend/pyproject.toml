[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cookbook-backend"
version = "0.1.0"
description = "FastAPI backend for the chatbot application"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
