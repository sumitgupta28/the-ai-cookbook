plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'in.ai'
version = '0.0.1-SNAPSHOT'
description = 'Your friendly personal assistant powered by Ollama (default) or Anthropic'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations.all {
	// Embeddings run via onnxruntime; DJL is only used for the HuggingFace tokenizer.
	// The transitive DJL PyTorch engine is unused but eagerly tries to download a native
	// library on startup, which fails behind the corporate proxy. Exclude it.
	exclude group: 'ai.djl.pytorch', module: 'pytorch-engine'
}

ext {
	set('springAiVersion', "1.1.4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

	implementation 'org.springframework.ai:spring-ai-tika-document-reader'
	implementation 'org.springframework.ai:spring-ai-transformers'  // Added: Required for TransformersEmbeddingModel
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.apache.poi:poi-ooxml:5.4.0'
	implementation 'dev.langchain4j:langchain4j:0.36.2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


	// Springdoc OpenAPI starter (includes Swagger UI)
//	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
